<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="680" height="290" fill="#FFFFFF"/>

  <!-- title -->
  <text x="0" y="14" font-size="12.5" font-weight="600" fill="#111827">The analyzer export has one row per byte and no STOP column,</text>
  <text x="0" y="30" font-size="12.5" font-weight="600" fill="#111827">so a transaction boundary is recovered from the silence between bytes.</text>

  <!-- ============ row 1: one phase ============ -->
  <text x="0" y="62" font-size="10.5" fill="#374151">One phase: bytes back to back</text>
  <g>
    <rect x="0"   y="70" width="38" height="20" rx="2" fill="#EFF6FF" stroke="#1557F9" stroke-width="1"/>
    <rect x="46"  y="70" width="38" height="20" rx="2" fill="#EFF6FF" stroke="#1557F9" stroke-width="1"/>
    <rect x="92"  y="70" width="38" height="20" rx="2" fill="#EFF6FF" stroke="#1557F9" stroke-width="1"/>
    <rect x="138" y="70" width="38" height="20" rx="2" fill="#EFF6FF" stroke="#1557F9" stroke-width="1"/>
    <text x="19"  y="84" font-size="9.5" text-anchor="middle" fill="#111827" font-family="monospace">00</text>
    <text x="65"  y="84" font-size="9.5" text-anchor="middle" fill="#111827" font-family="monospace">DE</text>
    <text x="111" y="84" font-size="9.5" text-anchor="middle" fill="#111827" font-family="monospace">AD</text>
    <text x="157" y="84" font-size="9.5" text-anchor="middle" fill="#111827" font-family="monospace">BE</text>
    <!-- gap marker -->
    <line x1="38" y1="100" x2="46" y2="100" stroke="#6B7280" stroke-width="1"/>
    <line x1="38" y1="96" x2="38" y2="104" stroke="#6B7280" stroke-width="1"/>
    <line x1="46" y1="96" x2="46" y2="104" stroke="#6B7280" stroke-width="1"/>
    <text x="56" y="110" font-size="10" fill="#374151"><tspan font-weight="600">95 us</tspan> between bytes, one byte time at 100 kHz. Never a boundary.</text>
  </g>

  <!-- ============ row 2: repeated START ============ -->
  <text x="0" y="146" font-size="10.5" fill="#374151">Two phases, no STOP: a repeated START</text>
  <g>
    <rect x="0"  y="154" width="38" height="20" rx="2" fill="#EFF6FF" stroke="#1557F9" stroke-width="1"/>
    <text x="19" y="168" font-size="9.5" text-anchor="middle" fill="#111827" font-family="monospace">00</text>
    <text x="44" y="151" font-size="9" fill="#1557F9" font-weight="600">Sr</text>
    <line x1="52" y1="152" x2="52" y2="176" stroke="#1557F9" stroke-width="1.6" stroke-dasharray="3 2"/>
    <rect x="60"  y="154" width="38" height="20" rx="2" fill="#EFF6FF" stroke="#1557F9" stroke-width="1"/>
    <rect x="106" y="154" width="38" height="20" rx="2" fill="#EFF6FF" stroke="#1557F9" stroke-width="1"/>
    <rect x="152" y="154" width="38" height="20" rx="2" fill="#EFF6FF" stroke="#1557F9" stroke-width="1"/>
    <text x="79"  y="168" font-size="9.5" text-anchor="middle" fill="#111827" font-family="monospace">DE</text>
    <text x="125" y="168" font-size="9.5" text-anchor="middle" fill="#111827" font-family="monospace">AD</text>
    <text x="171" y="168" font-size="9.5" text-anchor="middle" fill="#111827" font-family="monospace">BE</text>
    <line x1="38" y1="184" x2="60" y2="184" stroke="#6B7280" stroke-width="1"/>
    <line x1="38" y1="180" x2="38" y2="188" stroke="#6B7280" stroke-width="1"/>
    <line x1="60" y1="180" x2="60" y2="188" stroke="#6B7280" stroke-width="1"/>
    <text x="70" y="194" font-size="10" fill="#374151"><tspan font-weight="600">210 us</tspan>, about two byte times: the START plus the re-sent address.</text>
  </g>

  <!-- ============ row 3: STOP ============ -->
  <text x="0" y="230" font-size="10.5" fill="#374151">Two transactions: a STOP between them</text>
  <g>
    <rect x="0"  y="238" width="38" height="20" rx="2" fill="#EFF6FF" stroke="#1557F9" stroke-width="1"/>
    <text x="19" y="252" font-size="9.5" text-anchor="middle" fill="#111827" font-family="monospace">EF</text>
    <text x="44" y="235" font-size="9" fill="#6B7280" font-weight="600">P</text>
    <line x1="50" y1="236" x2="50" y2="260" stroke="#6B7280" stroke-width="1.6"/>
    <rect x="152" y="238" width="38" height="20" rx="2" fill="#EFF6FF" stroke="#1557F9" stroke-width="1"/>
    <text x="171" y="252" font-size="9.5" text-anchor="middle" fill="#111827" font-family="monospace">04</text>
    <line x1="38" y1="268" x2="152" y2="268" stroke="#6B7280" stroke-width="1"/>
    <line x1="38" y1="264" x2="38" y2="272" stroke="#6B7280" stroke-width="1"/>
    <line x1="152" y1="264" x2="152" y2="272" stroke="#6B7280" stroke-width="1"/>
    <text x="162" y="278" font-size="10" fill="#374151"><tspan font-weight="600">11.6 ms</tspan>, two orders of magnitude clear of the other two.</text>
  </g>

  <!-- the cut -->
  <g>
    <line x1="440" y1="52" x2="440" y2="215" stroke="#1557F9" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="448" y="70" font-size="10.5" font-weight="600" fill="#1557F9">the cut</text>
    <text x="448" y="86" font-size="10" fill="#374151">8x the median</text>
    <text x="448" y="100" font-size="10" fill="#374151">inter-byte gap,</text>
    <text x="448" y="114" font-size="10" fill="#374151">about 760 us here.</text>
    <text x="448" y="136" font-size="10" fill="#6B7280">Above it, a STOP.</text>
    <text x="448" y="150" font-size="10" fill="#6B7280">Below it, the same</text>
    <text x="448" y="164" font-size="10" fill="#6B7280">transaction continues.</text>
    <text x="448" y="186" font-size="10" fill="#374151">Measured per capture,</text>
    <text x="448" y="200" font-size="10" fill="#374151">so it follows bus speed.</text>
  </g>
</svg>
