<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372"
     font-family="Inter, 'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
    <marker id="arwb" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1557F9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="372" fill="#FFFFFF"/>

  <!-- actors -->
  <rect x="16"  y="12" width="212" height="36" rx="4" fill="#EFF6FF" stroke="#D1D5DB"/>
  <rect x="412" y="12" width="212" height="36" rx="4" fill="#EFF6FF" stroke="#D1D5DB"/>
  <text x="122" y="35" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Host adapter</text>
  <text x="518" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">STM32 target</text>
  <text x="518" y="43" text-anchor="middle" font-size="10" fill="#6B7280">held in system bootloader</text>

  <!-- lifelines -->
  <line x1="122" y1="48" x2="122" y2="352" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="518" y1="48" x2="518" y2="352" stroke="#D1D5DB" stroke-width="1"/>

  <!-- 1. erase opcode -->
  <line x1="122" y1="80" x2="518" y2="80" stroke="#374151" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="320" y="74" text-anchor="middle" font-size="11.5" fill="#111827">No-Stretch Erase  45 BA</text>

  <!-- 2. ack -->
  <line x1="518" y1="108" x2="122" y2="108" stroke="#1557F9" stroke-width="1.4" marker-end="url(#arwb)"/>
  <text x="320" y="102" text-anchor="middle" font-size="11.5" fill="#1557F9">ACK  79</text>

  <!-- 3. page list -->
  <line x1="122" y1="136" x2="518" y2="136" stroke="#374151" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="320" y="130" text-anchor="middle" font-size="11.5" fill="#111827">page count and list, checksum</text>

  <!-- busy band -->
  <rect x="500" y="152" width="36" height="128" rx="3" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="560" y="176" font-size="10.5" fill="#92400E">erasing:</text>
  <text x="560" y="190" font-size="10.5" fill="#92400E">the target</text>
  <text x="560" y="204" font-size="10.5" fill="#92400E">cannot</text>
  <text x="560" y="218" font-size="10.5" fill="#92400E">answer</text>

  <!-- poll loop bracket -->
  <path d="M40 168 L28 168 L28 250 L40 250" fill="none" stroke="#9CA3AF" stroke-width="1"/>
  <text x="22" y="205" text-anchor="middle" font-size="10.5" fill="#6B7280"
        transform="rotate(-90 22 205)">poll while busy</text>

  <!-- 4. poll, nacked -->
  <line x1="122" y1="182" x2="500" y2="182" stroke="#374151" stroke-width="1.2"
        stroke-dasharray="5 3" marker-end="url(#arw)"/>
  <text x="311" y="176" text-anchor="middle" font-size="11.5" fill="#111827">read status byte</text>

  <line x1="500" y1="210" x2="122" y2="210" stroke="#B91C1C" stroke-width="1.2"
        stroke-dasharray="5 3" marker-end="url(#arw)"/>
  <text x="311" y="204" text-anchor="middle" font-size="11.5" fill="#B91C1C">address not acknowledged</text>
  <text x="311" y="226" text-anchor="middle" font-size="10.5" fill="#6B7280">nothing was delivered, so retrying is safe</text>

  <!-- 5. final poll -->
  <line x1="122" y1="300" x2="518" y2="300" stroke="#374151" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="320" y="294" text-anchor="middle" font-size="11.5" fill="#111827">read status byte</text>

  <line x1="518" y1="328" x2="122" y2="328" stroke="#1557F9" stroke-width="1.4" marker-end="url(#arwb)"/>
  <text x="320" y="322" text-anchor="middle" font-size="11.5" fill="#1557F9">ACK  79   erase complete</text>

  <!-- footnote -->
  <text x="320" y="360" text-anchor="middle" font-size="10.5" fill="#6B7280">
    The BUSY byte 76 is defined by ST but is never transmitted by this device.
  </text>
</svg>
