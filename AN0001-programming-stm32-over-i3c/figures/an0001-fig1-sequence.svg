<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340"
     font-family="Inter, 'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
    <marker id="arwb" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1557F9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="340" fill="#FFFFFF"/>

  <!-- actors -->
  <rect x="16"  y="12" width="212" height="36" rx="4" fill="#EFF6FF" stroke="#D1D5DB"/>
  <rect x="412" y="12" width="212" height="36" rx="4" fill="#EFF6FF" stroke="#D1D5DB"/>
  <text x="122" y="35" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Supernova &#183; controller</text>
  <text x="518" y="35" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">STM32 bootloader &#183; target</text>

  <!-- lifelines -->
  <line x1="122" y1="48" x2="122" y2="326" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="518" y1="48" x2="518" y2="326" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- 1 ENTDAA -->
  <text x="122" y="82" font-size="12" fill="#374151" font-family="Consolas, monospace">ENTDAA (broadcast)</text>
  <line x1="122" y1="94" x2="518" y2="94" stroke="#374151" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- 2 PID -->
  <text x="518" y="126" text-anchor="end" font-size="12" fill="#374151" font-family="Consolas, monospace">PID &#183; BCR &#183; DCR</text>
  <line x1="518" y1="138" x2="122" y2="138" stroke="#374151" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- 3 assign -->
  <text x="122" y="170" font-size="12" fill="#374151" font-family="Consolas, monospace">assign dynamic address 0x08</text>
  <line x1="122" y1="182" x2="518" y2="182" stroke="#374151" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- 4 sync -->
  <text x="122" y="214" font-size="12" fill="#374151" font-family="Consolas, monospace">private write: 0x5A</text>
  <line x1="122" y1="226" x2="518" y2="226" stroke="#374151" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- 5 IBI -->
  <text x="518" y="258" text-anchor="end" font-size="12" font-weight="700" fill="#1557F9" font-family="Consolas, monospace">IBI payload: 0x79 (ACK)</text>
  <line x1="518" y1="270" x2="122" y2="270" stroke="#1557F9" stroke-width="2.2" marker-end="url(#arwb)"/>

  <text x="122" y="298" font-size="11.5" fill="#6B7280">Session open. Command opcodes follow, each acknowledged by an IBI.</text>
</svg>
