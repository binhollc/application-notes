<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372"
     font-family="Inter, 'Segoe UI', system-ui, Arial, sans-serif">

  <rect x="0" y="0" width="640" height="372" fill="#FFFFFF"/>

  <text x="320" y="18" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">
    Three steps to an in-band interrupt, and where each one lives
  </text>

  <!-- step headings -->
  <text x="112" y="44" text-anchor="middle" font-size="9.5" font-weight="600"
        letter-spacing="0.6" fill="#6B7280">1. ENABLE THE SOURCE</text>
  <text x="320" y="44" text-anchor="middle" font-size="9.5" font-weight="600"
        letter-spacing="0.6" fill="#6B7280">2. ROUTE IT TO THE IBI</text>
  <text x="528" y="44" text-anchor="middle" font-size="9.5" font-weight="600"
        letter-spacing="0.6" fill="#6B7280">3. ENABLE INTERRUPTS</text>
  <path d="M20 52 L620 52" stroke="#D9E1EE" stroke-width="1"/>

  <!-- flow arrows between the three columns -->
  <path d="M204 96 L228 96" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#tip)"/>
  <path d="M412 96 L436 96" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#tip)"/>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- ============ LSM6DSV, data-ready ============ -->
  <text x="24" y="76" font-size="10" font-weight="600" fill="#374151">LSM6DSV, data-ready</text>

  <rect x="24" y="82" width="180" height="30" rx="4" fill="#F3F6FB" stroke="#C7D2E4"/>
  <text x="114" y="101" text-anchor="middle" font-size="10" fill="#111827">
    CTRL1 output data rate
  </text>

  <rect x="232" y="82" width="180" height="30" rx="4" fill="#F3F6FB" stroke="#C7D2E4"/>
  <text x="322" y="101" text-anchor="middle" font-size="10" fill="#111827">
    INT1_CTRL bit 0
  </text>

  <rect x="440" y="82" width="176" height="30" rx="4" fill="#EAF3EC" stroke="#B7D8BF"/>
  <text x="528" y="101" text-anchor="middle" font-size="10" fill="#111827">
    ENEC with ENINT
  </text>

  <!-- ============ LSM6DSV, motion features ============ -->
  <text x="24" y="140" font-size="10" font-weight="600" fill="#374151">LSM6DSV, wake-up and other features</text>

  <rect x="24" y="146" width="180" height="44" rx="4" fill="#F3F6FB" stroke="#C7D2E4"/>
  <text x="114" y="163" text-anchor="middle" font-size="10" fill="#111827">
    WAKE_UP_THS threshold
  </text>
  <text x="114" y="178" text-anchor="middle" font-size="10" fill="#111827">
    FUNCTIONS_ENABLE bit 7
  </text>

  <rect x="232" y="146" width="180" height="44" rx="4" fill="#FFF4E5" stroke="#EAD2A8"/>
  <text x="322" y="163" text-anchor="middle" font-size="10" fill="#111827">
    MD1_CFG, one bit
  </text>
  <text x="322" y="178" text-anchor="middle" font-size="10" fill="#111827">
    per feature
  </text>

  <rect x="440" y="146" width="176" height="44" rx="4" fill="#EAF3EC" stroke="#B7D8BF"/>
  <text x="528" y="172" text-anchor="middle" font-size="10" fill="#111827">
    ENEC with ENINT
  </text>

  <text x="232" y="204" font-size="9" fill="#92400E">
    not INT1_CTRL, which is data-ready only
  </text>

  <!-- ============ LPS22DF ============ -->
  <text x="24" y="232" font-size="10" font-weight="600" fill="#374151">LPS22DF, data-ready</text>

  <rect x="24" y="238" width="180" height="30" rx="4" fill="#F3F6FB" stroke="#C7D2E4"/>
  <text x="114" y="257" text-anchor="middle" font-size="10" fill="#111827">
    CTRL_REG1 output data rate
  </text>

  <rect x="232" y="238" width="180" height="30" rx="4" fill="#F3F6FB" stroke="#C7D2E4"/>
  <text x="322" y="257" text-anchor="middle" font-size="10" fill="#111827">
    CTRL_REG4 bit 5
  </text>

  <rect x="440" y="238" width="176" height="30" rx="4" fill="#EAF3EC" stroke="#B7D8BF"/>
  <text x="528" y="257" text-anchor="middle" font-size="10" fill="#111827">
    ENEC with ENINT
  </text>

  <path d="M20 288 L620 288" stroke="#D9E1EE" stroke-width="1"/>

  <!-- the two things that stop interrupts arriving -->
  <text x="24" y="308" font-size="9.5" font-weight="600" letter-spacing="0.6"
        fill="#6B7280">IF NOTHING ARRIVES</text>

  <circle cx="30" cy="326" r="2.6" fill="#B45309"/>
  <text x="42" y="329" font-size="10" fill="#374151">
    Step 3 missing: the bus stays silent no matter what the sensor is doing.
  </text>

  <circle cx="30" cy="345" r="2.6" fill="#B45309"/>
  <text x="42" y="348" font-size="10" fill="#374151">
    Declared interrupt payload too large: GETMRL byte 3 must not exceed 8 on this adapter.
  </text>

  <circle cx="30" cy="364" r="2.6" fill="#B45309"/>
  <text x="42" y="367" font-size="10" fill="#374151">
    One interrupt then silence: the source is a level, so clear it or make it pulse.
  </text>
</svg>
