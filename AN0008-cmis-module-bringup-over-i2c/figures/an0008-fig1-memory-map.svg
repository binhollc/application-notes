<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" width="640" height="352"
     font-family="Inter, 'Segoe UI', system-ui, Arial, sans-serif">

  <rect x="0" y="0" width="640" height="352" fill="#FFFFFF"/>

  <text x="320" y="18" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">
    The 256 byte window a host addresses, and the pages behind it
  </text>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9CA3AF"/>
    </marker>
    <marker id="tipblue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1557F9"/>
    </marker>
  </defs>

  <text x="150" y="44" text-anchor="middle" font-size="9.5" font-weight="600"
        letter-spacing="0.6" fill="#6B7280">DIRECTLY ADDRESSABLE</text>
  <text x="470" y="44" text-anchor="middle" font-size="9.5" font-weight="600"
        letter-spacing="0.6" fill="#6B7280">SELECTED BY PAGE</text>
  <path d="M20 52 L620 52" stroke="#D9E1EE" stroke-width="1"/>

  <!-- ============ Upper Memory ============ -->
  <rect x="60" y="70" width="180" height="88" rx="3" fill="#EEF3FE" stroke="#1557F9" stroke-width="1.2"/>
  <text x="150" y="94" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Upper Memory</text>
  <text x="150" y="112" text-anchor="middle" font-size="10.5" fill="#374151">80h to FFh</text>
  <text x="150" y="132" text-anchor="middle" font-size="9.5" fill="#6B7280">a window onto one page</text>
  <text x="150" y="146" text-anchor="middle" font-size="9.5" fill="#6B7280">at a time</text>

  <!-- wrap arrow, 255 back to 128 -->
  <path d="M50 150 C28 150 28 78 50 78" fill="none" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#tip)"/>
  <text x="18" y="118" text-anchor="middle" font-size="9" fill="#6B7280" transform="rotate(-90 18 118)">255 to 128</text>

  <!-- ============ the boundary ============ -->
  <path d="M56 166 L244 166" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="150" y="180" text-anchor="middle" font-size="9.5" font-weight="600" fill="#B45309">
    an access never crosses 7Fh
  </text>

  <!-- ============ Lower Memory ============ -->
  <rect x="60" y="190" width="180" height="106" rx="3" fill="#F7F9FC" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="150" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Lower Memory</text>
  <text x="150" y="232" text-anchor="middle" font-size="10.5" fill="#374151">00h to 7Fh</text>
  <text x="150" y="250" text-anchor="middle" font-size="9.5" fill="#6B7280">static, always visible</text>
  <rect x="76" y="260" width="148" height="26" rx="2" fill="#FFFFFF" stroke="#1557F9" stroke-width="1"/>
  <text x="150" y="271" text-anchor="middle" font-size="9" font-weight="600" fill="#111827">00h:126 BankSelect</text>
  <text x="150" y="282" text-anchor="middle" font-size="9" font-weight="600" fill="#111827">00h:127 PageSelect</text>

  <!-- wrap arrow, 127 back to 0 -->
  <path d="M50 288 C28 288 28 198 50 198" fill="none" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#tip)"/>
  <text x="18" y="243" text-anchor="middle" font-size="9" fill="#6B7280" transform="rotate(-90 18 243)">127 to 0</text>

  <!-- ============ page selection ============ -->
  <path d="M228 268 C296 268 292 82 352 82" fill="none" stroke="#1557F9" stroke-width="1.4" marker-end="url(#tipblue)"/>
  <text x="272" y="192" text-anchor="middle" font-size="9" fill="#1557F9">selects one page</text>

  <!-- ============ the pages ============ -->
  <g font-size="9.5" fill="#374151">
    <rect x="356" y="70" width="234" height="22" rx="2" fill="#EEF3FE" stroke="#1557F9" stroke-width="1.2"/>
    <text x="368" y="85" font-weight="600" fill="#111827">00h  Administrative, vendor block, checksum</text>
    <rect x="360" y="96" width="230" height="22" rx="2" fill="#FFFFFF" stroke="#C7D2E4"/>
    <text x="372" y="111">01h  Advertising, FullPageReadSupported</text>
    <rect x="360" y="122" width="230" height="22" rx="2" fill="#FFFFFF" stroke="#C7D2E4"/>
    <text x="372" y="137">02h  Thresholds</text>
    <rect x="360" y="148" width="230" height="22" rx="2" fill="#FFFFFF" stroke="#C7D2E4"/>
    <text x="372" y="163">10h, 11h  Lane and data path config, status</text>
    <rect x="360" y="174" width="230" height="22" rx="2" fill="#FFFFFF" stroke="#C7D2E4"/>
    <text x="372" y="189">17h  Flags and masks, clear on read</text>
    <rect x="360" y="200" width="230" height="22" rx="2" fill="#FFFFFF" stroke="#C7D2E4"/>
    <text x="372" y="215">20h to 2Fh  Versatile diagnostics monitoring</text>
    <rect x="360" y="226" width="230" height="22" rx="2" fill="#FFFFFF" stroke="#C7D2E4"/>
    <text x="372" y="241">9Fh  CDB command, response, Local Payload</text>
    <rect x="360" y="252" width="230" height="22" rx="2" fill="#FFFFFF" stroke="#C7D2E4"/>
    <text x="372" y="267">A0h to AFh  CDB Extended Payload, 2048 B</text>
  </g>
  <text x="475" y="288" text-anchor="middle" font-size="9" fill="#6B7280">
    one of these is visible at 80h to FFh
  </text>

  <path d="M20 306 L620 306" stroke="#D9E1EE" stroke-width="1"/>
  <text x="20" y="322" font-size="9.5" fill="#6B7280">
    Appendix B.1.2: the byte address wraps inside its own 128 byte segment. An 8 byte read at 00h:124 returns
  </text>
  <text x="20" y="336" font-size="9.5" fill="#6B7280">
    bytes 124 to 127 and then bytes 0 to 3, not the start of a page. Split every access at the boundary.
  </text>
</svg>
