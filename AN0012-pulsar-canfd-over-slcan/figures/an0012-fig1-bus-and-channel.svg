<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"
     font-family="Inter, 'Segoe UI', system-ui, Arial, sans-serif">

  <rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/>

  <text x="320" y="18" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">
    The bus, and the order the channel has to be opened in
  </text>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- ============ topology ============ -->
  <text x="20" y="42" font-size="9.5" font-weight="600" letter-spacing="0.6"
        fill="#6B7280">TWO NODES, ONE BUS</text>
  <path d="M20 50 L620 50" stroke="#D9E1EE" stroke-width="1"/>

  <!-- host -->
  <rect x="248" y="62" width="144" height="34" rx="4" fill="#F3F6FB" stroke="#C7D2E4"/>
  <text x="320" y="83" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Windows host</text>

  <!-- USB legs -->
  <path d="M280 96 L150 118" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#tip)"/>
  <path d="M360 96 L490 118" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#tip)"/>
  <text x="196" y="104" text-anchor="middle" font-size="8.5" fill="#6B7280">USB CDC</text>
  <text x="446" y="104" text-anchor="middle" font-size="8.5" fill="#6B7280">USB serial</text>

  <!-- Pulsar -->
  <rect x="40" y="122" width="180" height="66" rx="4" fill="#F3F6FB" stroke="#C7D2E4"/>
  <text x="130" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Binho Pulsar</text>
  <text x="130" y="156" text-anchor="middle" font-size="9" fill="#374151">cdc_mode 4, SLCAN bridge</text>
  <text x="130" y="169" text-anchor="middle" font-size="9" fill="#374151">MCAN CAN0</text>
  <text x="130" y="182" text-anchor="middle" font-size="9" font-weight="600" fill="#374151">TJA1044GT</text>

  <!-- Feather -->
  <rect x="420" y="122" width="180" height="66" rx="4" fill="#F3F6FB" stroke="#C7D2E4"/>
  <text x="510" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Feather M4 CAN</text>
  <text x="510" y="156" text-anchor="middle" font-size="9" fill="#374151">Arduino, ACANFD library</text>
  <text x="510" y="169" text-anchor="middle" font-size="9" font-weight="600" fill="#374151">SAM E51 CAN1</text>
  <text x="510" y="182" text-anchor="middle" font-size="9" fill="#374151">onboard transceiver</text>

  <!-- the bus itself -->
  <path d="M220 148 L420 148" stroke="#1557F9" stroke-width="2"/>
  <path d="M220 164 L420 164" stroke="#1557F9" stroke-width="2"/>
  <text x="320" y="143" text-anchor="middle" font-size="9" font-weight="600" fill="#1557F9">CANH</text>
  <text x="320" y="177" text-anchor="middle" font-size="9" font-weight="600" fill="#1557F9">CANL</text>

  <!-- termination, bridging the two lines so it reads as a resistor across them -->
  <path d="M320 148 L320 150" stroke="#1557F9" stroke-width="1.2"/>
  <path d="M320 162 L320 164" stroke="#1557F9" stroke-width="1.2"/>
  <rect x="296" y="150" width="48" height="12" rx="2" fill="#FFFFFF" stroke="#1557F9" stroke-width="1.2"/>
  <text x="320" y="159" text-anchor="middle" font-size="8" font-weight="600" fill="#1557F9">120 &#937;</text>

  <text x="320" y="204" text-anchor="middle" font-size="9" fill="#6B7280">
    500 kbit/s arbitration, 2 Mbit/s data phase, both ends configured to match
  </text>

  <!-- ============ channel lifecycle ============ -->
  <text x="20" y="238" font-size="9.5" font-weight="600" letter-spacing="0.6"
        fill="#6B7280">OPENING THE CHANNEL, IN THIS ORDER</text>
  <path d="M20 246 L620 246" stroke="#D9E1EE" stroke-width="1"/>

  <rect x="24" y="262" width="86" height="40" rx="4" fill="#F3F6FB" stroke="#C7D2E4"/>
  <text x="67" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">C</text>
  <text x="67" y="295" text-anchor="middle" font-size="8.5" fill="#374151">close first</text>

  <rect x="134" y="262" width="86" height="40" rx="4" fill="#FFF4E5" stroke="#E8CFA3"/>
  <text x="177" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#B45309">S6</text>
  <text x="177" y="295" text-anchor="middle" font-size="8.5" fill="#B45309">500 kbit/s</text>

  <rect x="244" y="262" width="86" height="40" rx="4" fill="#FFF4E5" stroke="#E8CFA3"/>
  <text x="287" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#B45309">Y2</text>
  <text x="287" y="295" text-anchor="middle" font-size="8.5" fill="#B45309">2 Mbit/s data</text>

  <rect x="354" y="262" width="86" height="40" rx="4" fill="#EAF3EC" stroke="#B7D6C0"/>
  <text x="397" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">O</text>
  <text x="397" y="295" text-anchor="middle" font-size="8.5" fill="#374151">open</text>

  <rect x="464" y="262" width="152" height="40" rx="4" fill="#EAF3EC" stroke="#B7D6C0"/>
  <text x="540" y="281" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">frames flow</text>
  <text x="540" y="295" text-anchor="middle" font-size="8.5" fill="#374151">t / T / d / D / b / B</text>

  <path d="M110 282 L134 282" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#tip)"/>
  <path d="M220 282 L244 282" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#tip)"/>
  <path d="M330 282 L354 282" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#tip)"/>
  <path d="M440 282 L464 282" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#tip)"/>

  <!-- the capture annotation -->
  <path d="M177 306 L177 324 L397 324 L397 308" fill="none" stroke="#B45309"
        stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="287" y="338" text-anchor="middle" font-size="9" font-weight="600" fill="#B45309">
    the bitrates are captured here, when O is processed
  </text>
  <text x="287" y="351" text-anchor="middle" font-size="9" fill="#6B7280">
    S or Y sent after O is acknowledged and ignored until the channel is reopened
  </text>

  <path d="M20 366 L620 366" stroke="#D9E1EE" stroke-width="1"/>
  <text x="320" y="382" text-anchor="middle" font-size="9" fill="#6B7280">
    Every reply is a single byte: carriage return for accepted, bell (0x07) for rejected
  </text>

</svg>
